<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent Chat</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- highlight.js 主题：浅/深各一份，由 settings.js 按 data-theme 切换 -->
  <link rel="stylesheet" href="vendor/highlight-github.min.css" id="hljs-theme-light">
  <link rel="stylesheet" href="vendor/highlight-github-dark.min.css" id="hljs-theme-dark" disabled>
</head>
<body>
  <div class="app">

    <!-- 左侧：会话列表 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="app-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="app-title">AI Agent</span>
      </div>

      <button class="new-chat-btn" id="new-chat-btn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>新对话</span>
      </button>

      <nav class="session-list" id="session-list" aria-label="会话列表">
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-entry" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>设置</span>
        </button>
        <button class="sidebar-entry" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
          </svg>
          <span>关于</span>
        </button>
      </div>
    </aside>

    <!-- 右侧：聊天区 -->
    <main class="chat">
      <!-- 顶部栏 -->
      <header class="chat-header">
        <button class="icon-btn sidebar-toggle" type="button" aria-label="展开会话列表">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="chat-title-wrap">
          <div class="chat-title">让 DeepSeek 解释容器网络</div>
          <div class="chat-subtitle">AI Agent · 已连接</div>
        </div>
        <div class="chat-header-right">
          <button class="icon-btn" type="button" aria-label="设置">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- 消息区（由 chat.js 动态渲染） -->
      <div class="messages" id="messages">
      </div>

      <!-- 底部输入区 -->
      <footer class="input-area">
        <div class="input-box">
          <button class="icon-btn upload-btn" id="upload-btn" type="button" aria-label="上传图片" title="上传图片">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </button>
          <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="send-btn" id="send-btn" type="button" aria-label="发送" title="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">内容由 AI Agent 生成，请注意甄别</div>
      </footer>
    </main>
  </div>

  <!-- 设置面板（T3 接入逻辑，此处为静态结构） -->
  <div class="modal-overlay" id="settings-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-header">
        <h2 id="settings-title">设置</h2>
        <button class="icon-btn" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="setting-ws">WebSocket 地址</label>
          <input id="setting-ws" type="text" spellcheck="false">
        </div>
        <div class="field">
          <label for="setting-token">Pico Token</label>
          <div class="token-row">
            <input id="setting-token" type="password" spellcheck="false" autocomplete="off">
            <button class="btn-ghost" id="setting-token-toggle" type="button" title="显示 token">显示</button>
          </div>
          <div class="field-hint" id="setting-token-hint" hidden>已由部署配置自动注入，可直接使用；如需修改可在此填写并保存</div>
        </div>
        <div class="field">
          <label for="setting-model">默认模型</label>
          <input id="setting-model" type="text" spellcheck="false">
        </div>
        <div class="field">
          <label for="setting-theme">主题</label>
          <select id="setting-theme">
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- T6 部署层注入配置（可选）：deploy-web-chat.sh 生成 config.js，定义 window.PICO_WEB_CHAT_CONFIG。
       无此文件时前端回退为设置页手动填写 token（向后兼容）。文件仅存在于部署产物，不入仓库。 -->
  <script src="config.js"></script>
  <!-- T3 vendor：marked + highlight.js + DOMPurify（本地化，离线可用） -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <!-- T3 逻辑：markdown 需先于 chat.js 加载，供其 init 阶段渲染历史消息 -->
  <script src="js/markdown.js"></script>
  <!-- T2 逻辑 -->
  <script src="js/ws.js"></script>
  <script src="js/chat.js"></script>
  <!-- T3 逻辑 -->
  <script src="js/settings.js"></script>
</body>
</html>
