# PicoClaw Web Chat 静态站点（方案 A：独立端口托管，与 picoclaw-launcher 18800 无冲突）
# 部署：/etc/nginx/sites-available/web-chat -> sites-enabled/web-chat
server {
	listen 18888 default_server;

	root /opt/sophon/web-chat;
	index index.html;

	# 静态聊天前端
	location / {
		try_files $uri $uri/ /index.html;
	}

	# config.js 含敏感 token：禁止浏览器/代理缓存，避免落盘后长期暴露
	location = /config.js {
		default_type application/javascript;
		add_header Cache-Control "no-store, no-cache, must-revalidate";
		add_header Pragma "no-cache";
	}

	# 长文件缓存（vendor/js/css 带版本化文件名，可放心缓存）
	location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
		expires 7d;
		add_header Cache-Control "public";
	}
}