server:
  listenIP: 127.0.0.1
  port: 9779
  auth: true
  # authSecret 留空：启动时生成随机 32 字节 JWT secret 持久化到
  # /var/lib/bmssm/jwt_secret（见 pkg/auth.EnsureSecret）。显式配置会覆盖。
  defaultPassword: "admin"
  deviceName: "device_1"
log:
  level: info
  path: /var/log/bmssm
alarmThreshold:
  boardTemperature: 90
  coreTemperature: 90
  cpuRate: 0.95
  diskRate: 0.95
  totalMemoryScale: 0.95
  tpuRate: 0.95
  tpuScale: 0.95
db:
  driver: sqlite3
  path: /var/lib/bmssm/bmssm.db
ota:
  dryRun: false
metrics:
  enabled: true                    # 总开关；false 则不采集 Prometheus 指标、不写存档
  updateIntervalSeconds: 20        # 采样间隔（秒）。越小越精细但占空间越多；
                                   # 20s + v3 schema(18字段) 下 100MB 约存 2 年
  temperatureThresholds:
    critical: 90
    warning: 85
  archive:                         # 性能历史存档（定长二进制 record + gzip 分段）
    enabled: true                  # 存档开关
    path: /var/lib/bmssm/metrics   # 存档目录
    maxSizeMB: 100                # 所占空间淘汰上限（MB）；累计超限按 FIFO 删除最旧分段。无时间淘汰。
    channelBufferSize: 16          # 异步写入通道大小；满则丢弃最旧样本（不影响 Prometheus 实时更新）
firewall:
  enabled: true
  persistPath: /etc/iptables/rules.v4
  rollbackSeconds: 300
  protectPorts: []
software:
  autoRunScript: false   # 默认 false：禁止自动执行包内脚本（tar.gz/zip 的 install.sh、
                         # .deb 的 dpkg 维护脚本），防上传即 root RCE；需安装软件时置 true

# LLM API 转发（OpenAI 兼容）：独立 HTTP server，仅绑定本机。
# 客户端以 model=devproxy 请求，转发时替换为配置的目标模型名。
# 上游 api_base/key/目标模型由 /api/v1/llm-proxy/config 接口管理（sqlite 持久化）。
llm-proxy:
  enabled: true          # 总开关
  port: 18080            # 转发 server 端口（默认）
  listenIP: 127.0.0.1    # 仅本机可访问

# Reasonix ACP 适配器（agentproxy）：管理 reasonix acp 进程 + ACP v1 客户端 + 会话。
# 注意：agent 的 WS 已合并到主 server（server.listenIP:server.port 的 /agent/ws 路由），
# 不再存在 agentproxy:18990 独立监听/直连端点；下列 listenIP/port 仅作进程与会话核心的
# 配置占位（无独立监听使用），绑定回环更稳妥。
# enabled 默认 false：reasonix 二进制部署（T5 部署步骤）后置 true 再重启 bmssm。
agentproxy:
  enabled: false                       # 总开关（reasonix 部署后置 true）
  listenIP: 127.0.0.1                  # 无独立监听；占位默认绑定回环（已被主 server /agent/ws 接管）
  port: 18990                          # 保留占位（已被主 server /agent/ws 路由取代，不再监听）
  binaryPath: ""                       # 空则探测 PATH（reasonix）
  workDir: /data/sophon/reasonix-home  # 会话 cwd
  model: ""                            # 空 = reasonix 默认；如 deepseek-pro
  restartBackoffMax: 30s               # 崩溃重启退避上限
